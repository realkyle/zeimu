[project]
name = "zeimu"
version = "0.1.0"
description = "English-first, citation-backed answers about Japanese inheritance and gift tax from official NTA sources"
authors = [
    { name = "realkyle", email = "60832424+realkyle@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "selectolax>=1.0.2",
    "sudachidict-core>=20261015",
    "sudachipy>=0.7.0",
]

[project.scripts]
zeimu = "zeimu.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade,
# SIM simplify, RUF ruff-specific, N naming, PT pytest style
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
# Full-width Japanese punctuation is correct in this project, not a look-alike typo.
allowed-confusables = ["（", "）", "：", "；", "！", "？", "，", "＋", "－", "×", "＝", "～", "％", "Ｑ", "Ａ", "　"]

[tool.ruff.lint.per-file-ignores]
# HTML fixtures mirror real page markup, whose lines are long.
"tests/ingest/sample_pages.py" = ["E501"]
# Tests feed full-width input (３,０００万円, Ｑ1) on purpose; src/ stays strict.
"tests/**" = ["RUF001", "RUF003"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# "." lets test modules import shared helpers from the tests package.
search-path = ["src", "."]
preset = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
